services:
  - type: web
    name: vintage-aesthetics-api
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: npm ci && npx prisma generate && npm run build:api
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: QR_HMAC_SECRET
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_DEV_SIMULATOR
        value: "false"
